<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste de tabela acessível</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 500px;
    }

    caption {
      font-weight: bold;
      margin-bottom: 10px;
    }

    th, td {
      border: 1px solid #777;
      padding: 10px;
      text-align: left;
    }

    thead {
      background: #e5e7eb;
    }
  </style>
</head>
<body>

  <h1>Resultados da turma</h1>

  <table>
    <caption>Notas dos estudantes</caption>

    <thead>
      <tr>
        <th scope="col">Aluno</th>
        <th scope="col">HTML</th>
        <th scope="col">CSS</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <th scope="row">Ana</th>
        <td>9,0</td>
        <td>8,5</td>
      </tr>
      <tr>
        <th scope="row">João</th>
        <td>7,5</td>
        <td>9,0</td>
      </tr>
    </tbody>
  </table>

</body>
</html>
